name: Weekly storylines report

on:
  schedule:
    # Monday morning: matchups preview for the week ahead.
    - cron: "0 12 * * 1"
    # Weekly honors usually post Monday evening through Tuesday,
    # so re-run to pick them up as they appear.
    - cron: "0 23 * * 1"
    - cron: "0 14 * * 2"
    - cron: "0 22 * * 2"
    - cron: "0 14 * * 3"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run weekly report
        run: python fetch_weekly_report.py

      - name: Commit results
        run: |
          git config user.name "courtside-kiki-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/reports data/raw
          git diff --cached --quiet || git commit -m "Weekly report $(date -u +%Y-%m-%d)"
          git push
